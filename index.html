<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumera Host</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#070b16;--panel:#0d1424;--card:#121a2e;--ink:#e8eefc;--muted:#93a4c3;
  --line:rgba(148,163,184,.18);--blue:#3b82f6;--blue2:#60a5fa;--cyan:#22d3ee;
  --green:#34d399;--pink:#f472b6;--violet:#a78bfa;--warn:#fbbf24;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  font-family:Tahoma,"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100%;overflow-x:hidden;
}
button,input,textarea{font:inherit}
a{color:var(--blue2);text-decoration:none}
.hidden{display:none!important}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes scaleIn{from{opacity:0;transform:scale(.86)}to{opacity:1;transform:none}}
@keyframes spinGlow{to{transform:rotate(360deg)}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes rocket{0%{transform:translateY(40px) scale(.8);opacity:0}40%{opacity:1}100%{transform:translateY(-8px) scale(1);opacity:1}}

/* ===== INTRO ===== */
#intro{
  position:fixed;inset:0;z-index:9999;background:#050814;
  display:flex;align-items:center;justify-content:center;flex-direction:column;gap:18px;
}
#intro.hide{animation:fadeIn .4s ease reverse forwards;pointer-events:none}
.intro-ring{
  width:120px;height:120px;border-radius:50%;
  border:2px solid transparent;border-top-color:var(--cyan);border-right-color:var(--blue);
  animation:spinGlow 1s linear infinite;
  display:grid;place-items:center;position:relative;
}
.intro-ring::before{
  content:"";position:absolute;inset:10px;border-radius:50%;
  border:2px solid transparent;border-bottom-color:var(--violet);animation:spinGlow 1.4s linear infinite reverse;
}
.intro-logo{
  font-weight:900;letter-spacing:.08em;font-size:1.1rem;color:#fff;
  animation:scaleIn .7s ease .2s both;
}
.intro-sub{color:var(--muted);font-size:.85rem;animation:fadeUp .6s ease .45s both}

/* ===== AUTH ===== */
#auth-screen{min-height:100vh;display:none;grid-template-columns:1.1fr .9fr}
#auth-screen.show{display:grid}
@media(max-width:860px){#auth-screen.show{grid-template-columns:1fr}.auth-side{order:-1;min-height:220px}}
.auth-form-wrap{display:flex;align-items:center;justify-content:center;padding:36px 18px;background:radial-gradient(800px 400px at 20% 0%,rgba(59,130,246,.15),transparent)}
.auth-box{width:100%;max-width:400px;animation:fadeUp .55s ease both}
.eyebrow{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--cyan);font-weight:800;margin-bottom:10px}
.auth-box h1{font-size:1.7rem;font-weight:900;margin-bottom:8px}
.lead{color:var(--muted);line-height:1.75;font-size:.92rem;margin-bottom:20px}
.switch{display:inline-flex;background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:16px}
.switch button{border:0;background:transparent;padding:9px 16px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:700}
.switch button.on{background:linear-gradient(135deg,#1d4ed8,#3b82f6);color:#fff}
.field{margin-bottom:12px}
.field label{display:block;font-size:.8rem;font-weight:700;margin-bottom:6px;color:#cbd5e1}
.field input{
  width:100%;padding:12px 14px;border-radius:12px;outline:0;color:var(--ink);
  background:rgba(255,255,255,.04);border:1px solid var(--line);
}
.field input:focus{border-color:#60a5fa;box-shadow:0 0 0 3px rgba(59,130,246,.2)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;transition:.2s}
.btn:active{transform:scale(.98)}
.btn-main{width:100%;background:linear-gradient(135deg,#1e40af,#3b82f6);color:#fff;box-shadow:0 12px 28px rgba(37,99,235,.35)}
.btn-main:disabled{opacity:.55;cursor:wait}
.btn-green{background:linear-gradient(135deg,#047857,#10b981);color:#fff}
.btn-soft{background:rgba(255,255,255,.05);border:1px solid var(--line);color:var(--ink)}
.btn-soft:hover{background:rgba(255,255,255,.09)}
.btn-danger{background:rgba(220,38,38,.12);border:1px solid rgba(248,113,113,.35);color:#fca5a5}
.msg{margin-top:12px;font-size:.88rem;min-height:1.2em;color:var(--muted)}
.msg.err{color:#fca5a5}.msg.ok{color:var(--green)}
.auth-side{
  position:relative;overflow:hidden;padding:42px 34px;display:flex;flex-direction:column;justify-content:space-between;
  background:linear-gradient(165deg,#0a1224 0%,#132a5c 50%,#1d4ed8 100%);
}
.auth-side .orb{position:absolute;border-radius:50%;filter:blur(2px);opacity:.4;animation:float 6s ease-in-out infinite}
.auth-side .orb.a{width:240px;height:240px;background:#22d3ee;right:-60px;top:15%}
.auth-side .orb.b{width:160px;height:160px;background:#a78bfa;left:-40px;bottom:12%;animation-delay:-2s}
.auth-side .mark,.auth-side h2,.auth-side p,.auth-side .chips{position:relative;z-index:1}
.auth-side .mark{font-size:12px;letter-spacing:.16em;opacity:.75;margin-bottom:14px;font-weight:700}
.auth-side h2{font-size:clamp(1.7rem,3vw,2.4rem);font-weight:900;line-height:1.25;max-width:11ch}
.auth-side p{margin-top:14px;opacity:.85;line-height:1.75;max-width:32ch}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
.chips span{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.08);padding:7px 12px;border-radius:999px;font-size:.75rem}

/* ===== APP ===== */
#app-screen{display:none;min-height:100vh;flex-direction:column}
#app-screen.show{display:flex;animation:fadeIn .4s ease}
.topbar{
  position:sticky;top:0;z-index:40;display:flex;justify-content:space-between;align-items:center;
  padding:12px 16px;background:rgba(7,11,22,.82);border-bottom:1px solid var(--line);backdrop-filter:blur(16px);
}
.brand{display:flex;align-items:center;gap:10px;font-weight:900}
.brand b{
  width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:11px;color:#fff;
  background:linear-gradient(135deg,#1d4ed8,#22d3ee);box-shadow:0 0 24px rgba(34,211,238,.35);
}
.nav-links{display:flex;gap:6px;flex-wrap:wrap}
.nav-links a,.nav-links button{
  border:0;background:transparent;color:var(--muted);padding:8px 12px;border-radius:10px;cursor:pointer;font-weight:700;font-size:.85rem
}
.nav-links a:hover,.nav-links button:hover{color:#fff;background:rgba(255,255,255,.06)}
.menu-wrap{position:relative}
.menu-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.04);color:#fff;cursor:pointer}
.dropdown{
  position:absolute;left:0;top:calc(100% + 8px);width:230px;background:#0f172a;border:1px solid var(--line);
  border-radius:14px;padding:8px;box-shadow:0 20px 50px rgba(0,0,0,.45);animation:scaleIn .18s ease
}
.dropdown .who{padding:10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.dropdown .who strong{display:block}.dropdown .who span{color:var(--muted);font-size:.78rem}
.dropdown button{width:100%;text-align:right;border:0;background:transparent;color:var(--ink);padding:10px;border-radius:10px;cursor:pointer}
.dropdown button:hover{background:rgba(59,130,246,.15)}

.content{width:min(1100px,100%);margin:0 auto;padding:0 16px 80px;flex:1}

/* HOME LONG PAGE */
.hero{
  position:relative;padding:48px 0 28px;overflow:hidden;
}
.hero-bg{
  position:absolute;inset:-40px -20px auto;height:320px;pointer-events:none;
  background:
    radial-gradient(circle at 20% 40%, rgba(59,130,246,.25), transparent 45%),
    radial-gradient(circle at 80% 20%, rgba(34,211,238,.18), transparent 40%),
    radial-gradient(circle at 50% 80%, rgba(167,139,250,.15), transparent 45%);
}
.hero-inner{position:relative;z-index:1;display:grid;grid-template-columns:1.2fr .8fr;gap:22px;align-items:center}
@media(max-width:820px){.hero-inner{grid-template-columns:1fr}}
.hero h1{font-size:clamp(1.8rem,4vw,2.6rem);font-weight:900;line-height:1.25;margin-bottom:12px}
.hero h1 span{background:linear-gradient(90deg,#60a5fa,#22d3ee,#a78bfa);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--muted);line-height:1.8;max-width:42ch;margin-bottom:18px}
.hero-cta{display:flex;gap:10px;flex-wrap:wrap}
.hero-card{
  background:linear-gradient(160deg,rgba(18,26,46,.95),rgba(30,58,138,.35));
  border:1px solid var(--line);border-radius:22px;padding:22px;animation:float 5s ease-in-out infinite;
  box-shadow:0 25px 60px rgba(0,0,0,.35);
}
.hero-card .rocket{font-size:2.4rem;animation:rocket 1.2s ease both}
.hero-card .row{display:flex;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.hero-card .row b{font-size:1.2rem;color:var(--cyan)}
.hero-card .row span{display:block;font-size:.75rem;color:var(--muted)}

.section{padding:28px 0}
.section-title{display:flex;justify-content:space-between;align-items:end;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.section-title h2{font-size:1.25rem;font-weight:900}
.section-title p{color:var(--muted);font-size:.88rem}

.feat-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:900px){.feat-grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:560px){.feat-grid{grid-template-columns:1fr}}
.feat{
  background:rgba(18,26,46,.85);border:1px solid var(--line);border-radius:18px;padding:16px 16px 18px;
  transition:.25s transform,.25s border-color,.25s box-shadow;animation:fadeUp .5s ease both;
}
.feat:hover{transform:translateY(-4px);border-color:rgba(96,165,250,.45);box-shadow:0 16px 40px rgba(37,99,235,.15)}
.feat .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:1.2rem;margin-bottom:12px;background:rgba(59,130,246,.15)}
.feat h3{font-size:.98rem;margin-bottom:6px}
.feat p{color:var(--muted);font-size:.84rem;line-height:1.65}

.strip{
  display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:8px 0 10px;
}
@media(max-width:700px){.strip{grid-template-columns:repeat(2,1fr)}}
.strip .cell{
  background:rgba(255,255,255,.03);border:1px solid var(--line);border-radius:16px;padding:14px;text-align:center;
}
.strip .cell b{display:block;font-size:1.25rem;color:var(--blue2);margin-bottom:4px}
.strip .cell span{font-size:.78rem;color:var(--muted)}

.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:700px){.steps{grid-template-columns:1fr}}
.step{background:rgba(18,26,46,.9);border:1px solid var(--line);border-radius:18px;padding:18px;position:relative;overflow:hidden}
.step .n{position:absolute;left:14px;top:10px;font-size:2.2rem;font-weight:900;opacity:.12}
.step h3{margin-bottom:8px}
.step p{color:var(--muted);font-size:.88rem;line-height:1.65}

.tpl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:900px){.tpl-grid{grid-template-columns:repeat(2,1fr)}}
.tpl{
  border-radius:16px;padding:16px;border:1px solid var(--line);cursor:pointer;transition:.2s;
  background:linear-gradient(160deg,rgba(255,255,255,.04),rgba(59,130,246,.08));
}
.tpl:hover{transform:translateY(-3px);border-color:rgba(96,165,250,.5)}
.tpl h4{margin-bottom:6px;font-size:.92rem}
.tpl p{color:var(--muted);font-size:.78rem;line-height:1.55}

.projects-panel{background:rgba(18,26,46,.75);border:1px solid var(--line);border-radius:20px;padding:16px}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.search{
  border:1px solid var(--line);border-radius:11px;padding:10px 12px;outline:0;min-width:180px;
  background:rgba(0,0,0,.25);color:var(--ink);
}
.search:focus{border-color:#60a5fa}
.plist{display:grid;gap:10px;margin-top:12px}
.prow{
  display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;
  padding:14px;border-radius:14px;border:1px solid var(--line);background:rgba(255,255,255,.03);
  transition:.2s;
}
.prow:hover{border-color:rgba(96,165,250,.4);background:rgba(59,130,246,.08)}
.prow .n{font-weight:800}
.prow .s{font-size:.75rem;color:var(--muted);direction:ltr;text-align:left;margin-top:3px;word-break:break-all}
.prow .meta{font-size:.72rem;color:#64748b;margin-top:4px}
.prow .acts{display:flex;gap:6px;flex-wrap:wrap}

.ws-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin:18px 0 14px}
.linkbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(59,130,246,.12);border:1px solid rgba(96,165,250,.3);padding:10px;border-radius:12px;direction:ltr}
.linkbar code{font-size:.78rem;color:var(--blue2);word-break:break-all;flex:1;min-width:120px}
.flist{display:grid;gap:8px;margin:12px 0}
.frow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.03)}
.frow .fn{font-weight:700;direction:ltr;text-align:left}
.frow .acts{display:flex;gap:5px;flex-wrap:wrap}
.drop{border:1.5px dashed rgba(148,163,184,.35);border-radius:16px;padding:22px;text-align:center;background:rgba(255,255,255,.02);margin-top:12px;transition:.2s}
.drop.on{border-color:var(--cyan);background:rgba(34,211,238,.08)}
.drop input{margin-top:10px;color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px;border:1px dashed var(--line);border-radius:16px}
.card-block{background:rgba(18,26,46,.85);border:1px solid var(--line);border-radius:18px;padding:18px}

.modal-back{position:fixed;inset:0;background:rgba(2,6,23,.65);display:flex;align-items:center;justify-content:center;z-index:70;padding:12px;backdrop-filter:blur(6px)}
.modal{width:min(740px,100%);max-height:90vh;overflow:auto;background:#0f172a;border:1px solid var(--line);border-radius:16px;padding:18px;animation:scaleIn .22s ease}
.modal textarea{width:100%;min-height:260px;border:1px solid var(--line);border-radius:12px;padding:12px;direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:.8rem;background:#020617;color:#e2e8f0}
.modal-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}

#view-screen{display:none;position:fixed;inset:0;z-index:100;background:#fff}
#view-screen.show{display:block}
.view-bar{height:36px;background:#0f172a;color:#e2e8f0;font-size:12px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;direction:ltr}
#view-frame{width:100%;height:calc(100% - 36px);border:0}
.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px}
.toast{background:#e2e8f0;color:#0f172a;padding:11px 16px;border-radius:12px;font-size:.88rem;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:fadeUp .28s ease}

.faq{display:grid;gap:8px}
.faq details{background:rgba(18,26,46,.85);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.faq summary{cursor:pointer;font-weight:800}
.faq p{color:var(--muted);font-size:.88rem;line-height:1.7;margin-top:8px}
.footer-mini{text-align:center;color:#64748b;font-size:.8rem;padding:30px 0 10px}
</style>
</head>
<body>

<div id="intro">
  <div class="intro-ring"><span style="font-size:1.4rem">🚀</span></div>
  <div class="intro-logo">LUMERA HOST</div>
  <div class="intro-sub">در حال آماده‌سازی...</div>
</div>

<section id="auth-screen">
  <div class="auth-form-wrap">
    <div class="auth-box">
      <div class="eyebrow">Lumera Studio</div>
      <h1>ورود به Host</h1>
      <p class="lead">پروژه نامحدود، رایگان، بدون کد ایمیل. بساز و لینک بگیر.</p>
      <div class="switch">
        <button type="button" class="on" id="tab-login">ورود</button>
        <button type="button" id="tab-signup">ثبت‌نام</button>
      </div>
      <form id="auth-form">
        <div class="field"><label>ایمیل</label><input id="auth-email" type="email" dir="ltr" required placeholder="you@email.com"></div>
        <div class="field"><label>رمز عبور</label><input id="auth-pass" type="password" dir="ltr" required minlength="6"></div>
        <div class="field hidden" id="pass2-wrap"><label>تکرار رمز</label><input id="auth-pass2" type="password" dir="ltr" minlength="6"></div>
        <button class="btn btn-main" type="submit" id="auth-submit">ورود</button>
        <div class="msg" id="auth-msg"></div>
      </form>
    </div>
  </div>
  <aside class="auth-side">
    <div class="orb a"></div><div class="orb b"></div>
    <div>
      <div class="mark">LUMERA HOST</div>
      <h2>خانهٔ فایل‌های وب تو</h2>
      <p>اسکرول کن، امکانات را ببین، پروژه بساز و منتشر کن.</p>
    </div>
    <div class="chips"><span>نامحدود</span><span>رایگان</span><span>لینک عمومی</span><span>ویرایش آنلاین</span></div>
  </aside>
</section>

<section id="app-screen">
  <header class="topbar">
    <div class="brand"><b>LH</b> Lumera Host</div>
    <div class="nav-links">
      <button type="button" id="nav-home">خانه</button>
      <button type="button" id="nav-projects">پروژه‌ها</button>
      <a href="#features">امکانات</a>
      <a href="#templates">قالب‌ها</a>
    </div>
    <div class="menu-wrap">
      <button type="button" class="menu-btn" id="menu-btn">⋮</button>
      <div class="dropdown hidden" id="menu-drop">
        <div class="who"><strong id="menu-name">کاربر</strong><span id="menu-email"></span></div>
        <button type="button" id="menu-projects">پروژه‌ها</button>
        <button type="button" id="menu-logout">خروج</button>
      </div>
    </div>
  </header>
  <main class="content" id="main-content"></main>
</section>

<section id="view-screen">
  <div class="view-bar"><span id="view-label">Lumera Host</span><a href="#" id="view-home" style="color:#93c5fd">Home</a></div>
  <iframe id="view-frame" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
</section>
<div class="toast-wrap" id="toasts"></div>

<script>
(function () {
  var URL = 'https://cnvxbwdjuwczowaqgmia.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNudnhid2RqdXdjem93YXFnbWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MzE5NDQsImV4cCI6MjEwNjUwNzk0NH0.OB5lXXhHQXdnHlJU5azIuHHZ8G339BSNl4aieTDKeX8';
  if (!window.supabase || !window.supabase.createClient) {
    document.body.innerHTML = '<p style="padding:2rem;direction:rtl;font-family:Tahoma">کتابخانه لود نشد.</p>';
    return;
  }
  var sb = window.supabase.createClient(URL, KEY, {
    global: { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } }
  });

  var SK = 'lh_user_v4';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var intro = $('#intro');
  var authScreen = $('#auth-screen');
  var appScreen = $('#app-screen');
  var viewScreen = $('#view-screen');
  var main = $('#main-content');
  var mode = 'login';
  var user = null;
  var currentProject = null;
  var allProjects = [];

  function toast(t) {
    var el = document.createElement('div');
    el.className = 'toast'; el.textContent = t;
    $('#toasts').appendChild(el);
    setTimeout(function () { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(function () { el.remove(); }, 300); }, 2200);
  }
  function saveUser(u) {
    user = u;
    if (u) { u.project_limit = 99999; localStorage.setItem(SK, JSON.stringify(u)); }
    else localStorage.removeItem(SK);
  }
  function loadUser() {
    try { user = JSON.parse(localStorage.getItem(SK) || 'null'); } catch (e) { user = null; }
    if (user) user.project_limit = 99999;
    return user;
  }
  async function sha256(text) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  async function passHash(email, pass) {
    return sha256(String(email).toLowerCase().trim() + '|' + pass + '|lumera-host-v2');
  }
  function publicBase() {

  }
  function projectUrl(slug) { return publicBase() + '?p=' + encodeURIComponent(slug); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function fmtDate(iso) {
    if (!iso) return '';
    try {
      var d = new Date(iso);
      return d.toLocaleDateString('fa-IR') + ' ' + d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  async function tryPublicView() {
    var slug = new URLSearchParams(location.search).get('p');
    if (!slug) return false;
    intro.classList.add('hidden');
    authScreen.classList.remove('show');
    appScreen.classList.remove('show');
    viewScreen.classList.add('show');
    $('#view-label').textContent = 'Lumera Host · ' + slug;
    $('#view-home').href = publicBase();
    try {
      var res = await sb.from('host_projects').select('id,name,slug').eq('slug', slug).maybeSingle();
      if (res.error || !res.data) {
        document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:Tahoma;direction:rtl"><h2>پروژه پیدا نشد</h2></div>';
        return true;
      }
      var fr = await sb.from('host_files').select('filename,content').eq('project_id', res.data.id);
      var list = fr.data || [];
      var htmlFile = list.find(function (f) { return /^index\.html$/i.test(f.filename); })
        || list.find(function (f) { return /\.html$/i.test(f.filename); }) || list[0];
      if (!htmlFile) {
        $('#view-frame').srcdoc = '<p style="padding:2rem;font-family:Tahoma;direction:rtl">فایلی نیست</p>';
        return true;
      }
      var body = htmlFile.content || '';
      var css = list.filter(function (f) { return /\.css$/i.test(f.filename); });
      if (css.length && !/<link[^>]+stylesheet/i.test(body)) {
        var styles = css.map(function (c) { return '<style>' + c.content + '</style>'; }).join('\n');
        if (/<\/head>/i.test(body)) body = body.replace(/<\/head>/i, styles + '</head>');
        else body = styles + body;
      }
      $('#view-frame').srcdoc = body;
    } catch (e) {
      $('#view-frame').srcdoc = '<p style="padding:2rem;direction:rtl;font-family:Tahoma">خطا</p>';
    }
    return true;
  }

  $('#auth-form').onsubmit = async function (e) {
    e.preventDefault();
    var email = $('#auth-email').value.trim().toLowerCase();
    var pass = $('#auth-pass').value;
    var msg = $('#auth-msg');
    var btn = $('#auth-submit');
    msg.className = 'msg';
    if (!email || !pass) { msg.className = 'msg err'; msg.textContent = 'ایمیل و رمز لازم است'; return; }
    btn.disabled = true; msg.textContent = 'صبر کنید...';
    try {

      var data;
      if (mode === 'signup') {
        if (pass !== $('#auth-pass2').value) throw new Error('تکرار رمز اشتباه است');
        if (pass.length < 6) throw new Error('رمز حداقل ۶ کاراکتر');
        var reg = await sb.rpc('host_register', { p_email: email, p_hash: hash, p_name: email.split('@')[0] });
        if (reg.error) throw reg.error;
        data = reg.data;
      } else {
        var log = await sb.rpc('host_login', { p_email: email, p_hash: hash });
        if (log.error) throw log.error;
        data = log.data;
      }
      if (typeof data === 'string') { try { data = JSON.parse(data); } catch (_) {} }
      if (!data || data.ok === false) throw new Error((data && data.error) || 'خطا');
      if (data.user) data.user.project_limit = 99999;
      saveUser(data.user);
      toast(mode === 'signup' ? 'ثبت‌نام موفق' : 'ورود موفق');
      bootApp();
    } catch (err) {
      console.error(err);
      msg.className = 'msg err';
      var t = (err && err.message) || 'خطا';
      if (/Could not find the function|PGRST202|404|does not exist|gen_salt/i.test(t)) t = 'SQL را در Supabase Run کن.';
      msg.textContent = t;
    } finally { btn.disabled = false; }
  };

  }

  async function openProject(p) {
    currentProject = p;
    var fr = await sb.from('host_files').select('*').eq('project_id', p.id).order('filename');
    var list = fr.data || [];
    var url = projectUrl(p.slug);
    main.innerHTML =
      '<div class="ws-head"><div><button type="button" class="btn btn-soft" id="back">→ خانه</button>' +
      '<h2 style="margin-top:10px;font-size:1.3rem">' + esc(p.name) + '</h2>' +
      '<div style="color:var(--muted);font-size:.82rem;margin-top:4px">' + list.length + ' فایل</div></div>' +
      '<div class="linkbar"><code>' + esc(url) + '</code>' +
      '<button type="button" class="btn btn-main" id="copy" style="width:auto;padding:8px 12px">کپی</button>' +
      '<a class="btn btn-soft" href="' + url + '" target="_blank" rel="noopener" style="width:auto">باز کردن</a></div></div>' +
      '<div class="card-block"><h3 style="margin-bottom:8px">فایل‌ها</h3>' +
      '<div class="flist" id="flist"></div>' +
      '<div class="drop" id="drop"><div style="font-weight:800;color:var(--cyan)">آپلود فایل</div>' +
      '<div style="color:var(--muted);font-size:.85rem;margin-top:6px">بکش و رها کن</div>' +
      '<input type="file" id="fin" multiple accept=".html,.htm,.css,.js,.txt,.json,.svg,.md,text/*"></div>' +
      '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button type="button" class="btn btn-soft" id="newf">+ فایل جدید</button>' +
      '<button type="button" class="btn btn-soft" id="btn-blank">HTML خالی</button></div></div>';

    $('#back').onclick = function () { renderHome(false); };
    $('#copy').onclick = async function () {
      try { await navigator.clipboard.writeText(url); toast('کپی شد'); } catch (e) { prompt('لینک', url); }
    };

    var fl = $('#flist');
    function paint(items) {
      if (!items.length) { fl.innerHTML = '<div class="empty">فایلی نیست</div>'; return; }
      fl.innerHTML = items.map(function (f) {
        var size = new Blob([f.content || '']).size;
        return '<div class="frow" data-id="' + f.id + '"><div><div class="fn">' + esc(f.filename) + '</div>' +
          '<div style="font-size:.72rem;color:#64748b;margin-top:3px">' + size + ' بایت</div></div>' +
          '<div class="acts">' +
          '<button type="button" class="btn btn-soft btn-ed">ویرایش</button>' +
          '<button type="button" class="btn btn-soft btn-dl">دانلود</button>' +
          '<button type="button" class="btn btn-soft btn-rp">جایگزین</button>' +
          '<button type="button" class="btn btn-danger btn-rm">حذف</button></div></div>';
      }).join('');
      fl.querySelectorAll('.frow').forEach(function (row) {
        var f = items.find(function (x) { return x.id === row.getAttribute('data-id'); });
        row.querySelector('.btn-ed').onclick = function () { openEditor(f); };
        row.querySelector('.btn-dl').onclick = function () {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([f.content || ''], { type: 'text/plain;charset=utf-8' }));
          a.download = f.filename || 'file.txt'; a.click(); toast('دانلود');
        };
        row.querySelector('.btn-rm').onclick = async function () {
          if (!confirm('حذف؟')) return;
          await sb.from('host_files').delete().eq('id', f.id); toast('حذف شد'); openProject(p);
        };
        row.querySelector('.btn-rp').onclick = function () {
          var inp = document.createElement('input'); inp.type = 'file';
          inp.onchange = async function () {
            var file = inp.files && inp.files[0]; if (!file) return;
            var text = await file.text();
            await sb.from('host_files').update({ content: text, filename: file.name || f.filename, updated_at: new Date().toISOString() }).eq('id', f.id);
            await sb.from('host_projects').update({ updated_at: new Date().toISOString() }).eq('id', p.id);
            toast('جایگزین شد'); openProject(p);
          };
          inp.click();
        };
      });
    }
    paint(list);

    var drop = $('#drop'), fin = $('#fin');
    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('on'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('on'); });
    drop.addEventListener('drop', function (e) {
      e.preventDefault(); drop.classList.remove('on');
      if (e.dataTransfer.files) uploadFiles(e.dataTransfer.files, list);
    });
    fin.onchange = function () { uploadFiles(fin.files, list); };

    async function uploadFiles(fileList, existing) {
      var arr = Array.from(fileList || []);
      for (var i = 0; i < arr.length; i++) {
        var file = arr[i];
        var text = await file.text();
        var filename = file.name || 'file.txt';
        var found = existing.find(function (f) { return f.filename === filename; });
        if (found) await sb.from('host_files').update({ content: text, updated_at: new Date().toISOString() }).eq('id', found.id);
        else await sb.from('host_files').insert({ project_id: p.id, filename: filename, content: text });
      }
      await sb.from('host_projects').update({ updated_at: new Date().toISOString() }).eq('id', p.id);
      toast('ذخیره شد'); openProject(p);
    }

    $('#newf').onclick = async function () {
      var filename = prompt('نام فایل', 'page.html'); if (!filename) return;
      var content = /\.html?$/i.test(filename) ? '<!DOCTYPE html>\n<html><head><meta charset="UTF-8"><title>New</title></head><body><h1>Hello</h1></body></html>' : '';
      await sb.from('host_files').insert({ project_id: p.id, filename: filename, content: content });
      toast('ساخته شد'); openProject(p);
    };
    $('#btn-blank').onclick = async function () {
      await sb.from('host_files').insert({
        project_id: p.id,
        filename: 'blank-' + Date.now() + '.html',
        content: '<!DOCTYPE html>\n<html lang="fa" dir="rtl"><head><meta charset="UTF-8"><title>Blank</title></head><body style="font-family:Tahoma;padding:2rem;background:#0f172a;color:#e2e8f0"><h1>صفحه خالی</h1></body></html>'
      });
      toast('HTML خالی اضافه شد'); openProject(p);
    };
  }

  function openEditor(file) {
    var back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = '<div class="modal"><h3>ویرایش · ' + esc(file.filename) + '</h3>' +
      '<div class="field"><label>نام فایل</label><input id="ed-name" dir="ltr" value="' + esc(file.filename) + '" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:#020617;color:#e2e8f0"></div>' +
      '<div class="field"><label>محتوا</label><textarea id="ed-body" spellcheck="false"></textarea></div>' +
      '<div class="modal-actions"><button type="button" class="btn btn-main" id="ed-save" style="width:auto">ذخیره</button>' +
      '<button type="button" class="btn btn-soft" id="ed-cancel" style="width:auto">بستن</button></div></div>';
    document.body.appendChild(back);
    back.querySelector('#ed-body').value = file.content || '';
    back.querySelector('#ed-cancel').onclick = function () { back.remove(); };
    back.onclick = function (e) { if (e.target === back) back.remove(); };
    back.querySelector('#ed-save').onclick = async function () {
      var filename = back.querySelector('#ed-name').value.trim();
      var content = back.querySelector('#ed-body').value;
      if (!filename) { toast('نام فایل لازم است'); return; }
      var u = await sb.from('host_files').update({ filename: filename, content: content, updated_at: new Date().toISOString() }).eq('id', file.id);
      if (u.error) { toast(u.error.message); return; }
      if (currentProject) await sb.from('host_projects').update({ updated_at: new Date().toISOString() }).eq('id', currentProject.id);
      back.remove(); toast('ذخیره شد');
      if (currentProject) openProject(currentProject);
    };
  }

  (async function () {
    if (await tryPublicView()) return;
    var hasUser = !!loadUser();
    setTimeout(function () {
      finishIntro(!hasUser);
      if (hasUser) bootApp();
    }, 1600);
  })();
})();
</script>
</body>
</html>
